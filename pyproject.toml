[project]
name = "lumio"
version = "0.1.1"
description = "Deployable chat for trusted knowledge and data."
requires-python = ">=3.14"
dependencies = [
    "GitPython>=3.1.0",
    "lancedb>=0.34.0",
    "liteparse>=2.4.0",
    "markitdown[docx]>=0.1.6",
    "msgspec[yaml]>=0.21.1",
    "openai>=1.40.0",
    "piccolo[sqlite]>=1.35.0",
    "pyarrow>=24.0.0",
    "stario>=3.3.0",
]

[project.optional-dependencies]
# Optional semantic/hybrid Knowledge Base retrieval backend (#75). Lexical-only
# images and deployments do not install this group and never require Torch.
semantic = [
    "sentence-transformers>=2.6.0",
]
[project.scripts]
lumio = "lumio.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.61.0",
    "pytest>=8.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
