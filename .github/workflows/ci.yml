name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked
      - run: >-
          uv run --locked ruff check
          scripts/verify_lumio_wiki_wheel.py
          packages/lumio-wiki/src
          packages/lumio-wiki/tests
          tests/test_core_compatibility.py
          tests/test_workspace_layout.py
          tests/test_wheel_verifier.py
      - run: >-
          uv run --locked pytest -q
          packages/lumio-wiki/tests
          tests/test_core_compatibility.py
          tests/test_workspace_layout.py
          tests/test_wheel_verifier.py
          tests/test_core_sdk.py
          tests/test_core_sdk_index.py
          tests/test_core_without_lancedb.py
          tests/test_zero_index_retrieval.py
          tests/test_retrieval_adapter_contract.py
          tests/test_kb_control.py
          tests/test_relationship_types.py
          tests/test_graph_retrieval.py
          tests/test_health_report.py
          tests/test_registry.py
          tests/test_okf_export.py
          tests/test_okf_import.py
          tests/test_okf_round_trip.py
          tests/test_okf_reject_unsafe.py
          tests/test_onboarding_journey.py

  # Issue #180, AC6: run the canonical onboarding journey (docs/quickstart.md)
  # against a real MinIO so the documented command sequence cannot drift from
  # the CLI. The minioadmin values are MinIO's labelled local-test defaults on
  # an ephemeral CI container — never real credentials.
  onboarding-minio-journey:
    runs-on: ubuntu-latest
    services:
      minio:
        # ponytail: frozen drop-in; use maintained image once it supports command-free services.
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LUMIO_S3_ENDPOINT: http://localhost:9000
      LUMIO_S3_ALLOW_HTTP: "1"
      LUMIO_S3_REGION: us-east-1
      LUMIO_S3_TEST_BUCKET: lumio-quickstart
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked
      # The smoke journey creates its dedicated bucket with `mc` when present
      # (the same tool docs/quickstart.md uses); install it for the job.
      - name: Install mc (bucket creation, as documented)
        run: >
          curl -sfL
          https://dl.min.io/client/mc/release/linux-amd64/mc
          -o /usr/local/bin/mc && chmod +x /usr/local/bin/mc
      - name: Run the onboarding journey tests against MinIO
        run: uv run --locked pytest -q tests/test_onboarding_journey.py

  isolated-lumio-wiki-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv lock --check
      - run: uv build --package lumio-wiki --wheel --out-dir dist/lumio-wiki
      - run: uv build --package lumio --wheel --out-dir dist/lumio
      - run: uv venv --python 3.14 /tmp/lumio-wiki-venv
      - run: uv pip install --python /tmp/lumio-wiki-venv/bin/python dist/lumio-wiki/lumio_wiki-*.whl
      - name: Exercise only the installed lumio-wiki wheel
        run: |
          /tmp/lumio-wiki-venv/bin/python scripts/verify_lumio_wiki_wheel.py \
            dist/lumio-wiki/lumio_wiki-*.whl dist/lumio/lumio-*.whl \
            tests/fixtures/valid tests/fixtures/categorized_kb
