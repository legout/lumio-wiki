[project]
name = "lumio-wiki"
version = "0.1.1"
description = "Portable, model-free Knowledge Base foundation for Lumio."
requires-python = ">=3.14"
dependencies = [
    "msgpack>=1.0",
    "msgspec[yaml]>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumio_wiki"]
